<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Motivation 🕙 - Focus List</title>
  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('theme');
        if (storedTheme && storedTheme !== 'system') {
          document.documentElement.setAttribute('data-theme', storedTheme);
        } else {
          document.documentElement.setAttribute('data-theme', window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }
      } catch (error) {
        console.warn('Theme bootstrap failed', error);
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="app-shell.css">
</head>

<body class="motivation-body">
  <header class="header">
    <div class="header-left">
      <h1 class="logo">Focus List</h1>
    </div>
    <div class="header-right">
      <nav class="primary-nav" id="primaryNav" data-nav-menu>
        <a href="index.html" class="btn-ghost" style="text-decoration: none; color: inherit;">List View</a>
        <a href="calendar.html" class="btn-ghost" style="text-decoration: none; color: inherit;">Calendar View</a>
        <a href="matrix.html" class="btn-ghost" style="text-decoration: none; color: inherit;">Matrix View</a>

      </nav>
      <div class="header-actions">
        <!-- Global Music Controls (shown when music is playing) -->

        <button id="themeToggle" class="btn-ghost" aria-label="Toggle theme">
          <span class="theme-icon">☀️</span>
        </button>
      </div>
    </div>
  </header>

  <main class="motivation-layout">
    <section class="motivation-hero">
      <div>
        <p class="motivation-kicker">Motivation Vault</p>
        <h2 class="motivation-title">Motivation 🕙</h2>
        <p class="motivation-subtitle">Tap a reel to open it in full view with sound. Swipe or use the arrows for the next one; pause,
          mute, or replay without leaving the grid.</p>
      </div>
    </section>

    <section class="motivation-grid" id="motivationGrid"></section>
  </main>

  <div id="motivationModal" class="motivation-modal" aria-hidden="true"></div>

  <script src="theme.js" defer></script>
  <script src="header.js" defer></script>

  <script src="motivation.js" defer></script>
  <script src="nav.js" defer></script>
  <script src="supabase-config.js" defer></script>
  <script src="sync.js" defer></script>
</body>

</html>
