<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ambience Studio - Focus List</title>
    <meta name="description" content="Free focus sounds: rain, thunderstorm, fireplace and cottage ambience. Mix them while you work.">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.16);
            --glass-shadow: rgba(0, 0, 0, 0.3);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-glow: rgba(102, 126, 234, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
            background: #0a0a0a;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        /* Soft background glow (static gradients: cheap to render on phones) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 15% 20%, rgba(102, 126, 234, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(29, 185, 84, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 60% 45%, rgba(245, 87, 108, 0.10) 0%, transparent 50%);
            z-index: -1;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 36px;
            flex-wrap: wrap;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 12px 22px;
            border-radius: 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px var(--glass-shadow);
            transition: transform 0.2s, background 0.2s;
        }

        .back-btn:hover {
            transform: translateX(-4px);
            background: rgba(255, 255, 255, 0.12);
        }

        .header-title {
            flex: 1;
            min-width: 0;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #8ea2ff 55%, #b18cff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Toolbar: stop all + sleep timer */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding: 14px 16px;
            border-radius: 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
        }

        .toolbar-status {
            flex: 1;
            min-width: 160px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .toolbar-status strong {
            color: var(--text-primary);
        }

        .toolbar select,
        .toolbar button {
            min-height: 42px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            font: 600 0.9rem/1 inherit;
            font-family: inherit;
            padding: 0 14px;
            cursor: pointer;
        }

        .toolbar select option {
            background: #1a1a1f;
        }

        /* Grid */
        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
            gap: 24px;
        }

        .music-card {
            background: var(--glass-bg);
            border-radius: 28px;
            padding: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px var(--glass-shadow), inset 0 1px 1px rgba(255, 255, 255, 0.08);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s, border-color 0.3s, box-shadow 0.3s;
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .music-card.playing {
            border-color: rgba(142, 162, 255, 0.55);
            box-shadow: 0 14px 44px rgba(0, 0, 0, 0.45), 0 0 34px var(--accent-glow);
        }

        @media (hover: hover) {
            .music-card:hover {
                transform: translateY(-6px);
                background: rgba(255, 255, 255, 0.1);
            }
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .music-icon {
            width: 60px;
            height: 60px;
            background: var(--accent-gradient);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            flex-shrink: 0;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-type {
            font-size: 0.88rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .visualizer-container {
            height: 96px;
            background: rgba(0, 0, 0, 0.22);
            border-radius: 16px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .visualizer-bars {
            display: flex;
            gap: 4px;
            align-items: flex-end;
            height: 56px;
        }

        .v-bar {
            width: 6px;
            height: 10px;
            background: var(--accent-gradient);
            border-radius: 3px;
            transform-origin: bottom;
        }

        .music-card.playing .v-bar {
            animation: bounce 1s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { height: 10px; }
            50% { height: 50px; }
        }

        .v-bar:nth-child(odd) { animation-duration: 0.8s !important; }
        .v-bar:nth-child(2n) { animation-duration: 1.1s !important; }
        .v-bar:nth-child(3n) { animation-duration: 1.3s !important; }

        .controls-section {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .play-btn {
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            border: none;
            border-radius: 50%;
            background: #fff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .play-btn:active {
            transform: scale(0.92);
        }

        .volume-control {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-slider {
            flex: 1;
            min-width: 0;
            height: 32px;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.22);
        }

        .volume-slider::-moz-range-track {
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.22);
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            margin-top: -8px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .volume-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border: none;
            background: #fff;
            border-radius: 50%;
        }

        .volume-value {
            font-size: 0.82rem;
            font-weight: 600;
            min-width: 38px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .tip {
            margin-top: 28px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 14px;
            }

            .header {
                gap: 14px;
                margin-bottom: 20px;
            }

            .back-btn {
                padding: 10px 16px;
            }

            .subtitle {
                font-size: 0.95rem;
            }

            .music-grid {
                gap: 14px;
            }

            .music-card {
                padding: 16px;
                border-radius: 22px;
            }

            .card-header {
                margin-bottom: 14px;
            }

            .music-icon {
                width: 52px;
                height: 52px;
                font-size: 26px;
            }

            .visualizer-container {
                height: 64px;
                margin-bottom: 14px;
            }

            .visualizer-bars {
                height: 44px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .music-card,
            .music-card.playing .v-bar {
                animation: none !important;
            }
        }
    </style>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="app-shell.css">
</head>

<body>
    <div class="page">
        <div class="header">
            <a href="index.html" class="back-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back
            </a>
            <div class="header-title">
                <h1>Ambience Studio</h1>
                <p class="subtitle">Mix soothing sounds while you focus</p>
            </div>
        </div>

        <div class="toolbar">
            <div class="toolbar-status" id="ambStatus" aria-live="polite">Tap play on any sound. You can mix several.</div>
            <select id="sleepTimer" aria-label="Stop sounds after">
                <option value="0">No timer</option>
                <option value="15">Stop in 15 min</option>
                <option value="30">Stop in 30 min</option>
                <option value="60">Stop in 1 hour</option>
                <option value="90">Stop in 1.5 hours</option>
            </select>
            <button type="button" id="stopAll">Stop all</button>
        </div>

        <div class="music-grid" id="musicGrid"></div>

        <p class="tip">Sounds keep looping until you stop them. Your volume levels are remembered.</p>
    </div>

    <script src="ambience-engine.js"></script>
    <script>
        (function () {
            const engine = window.FLAmbience;
            const grid = document.getElementById('musicGrid');
            const status = document.getElementById('ambStatus');
            const sleepSelect = document.getElementById('sleepTimer');
            const bars = '<div class="v-bar"></div>'.repeat(9);
            const playIcon = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
            const pauseIcon = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

            grid.innerHTML = engine.SOUNDS.map((s, i) => {
                const vol = Math.round(engine.getVolume(s.id) * 100);
                return `
                <div class="music-card" id="card-${s.id}" style="animation-delay:${0.08 * i + 0.05}s">
                    <div class="card-header">
                        <div class="music-icon" aria-hidden="true">${s.icon}</div>
                        <div class="card-info">
                            <div class="card-title">${s.title}</div>
                            <div class="card-type">${s.kind}</div>
                        </div>
                    </div>
                    <div class="visualizer-container" aria-hidden="true">
                        <div class="visualizer-bars">${bars}</div>
                    </div>
                    <div class="controls-section">
                        <button class="play-btn" data-play="${s.id}" aria-label="Play ${s.title}">${playIcon}</button>
                        <div class="volume-control">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" />
                            </svg>
                            <input type="range" class="volume-slider" min="0" max="100" value="${vol}"
                                data-volume="${s.id}" aria-label="${s.title} volume">
                            <span class="volume-value" data-volume-label="${s.id}">${vol}%</span>
                        </div>
                    </div>
                </div>`;
            }).join('');

            grid.addEventListener('click', e => {
                const btn = e.target.closest('[data-play]');
                if (btn) engine.toggle(btn.dataset.play);
            });

            grid.addEventListener('input', e => {
                const slider = e.target.closest('[data-volume]');
                if (!slider) return;
                engine.setVolume(slider.dataset.volume, slider.value / 100);
                grid.querySelector(`[data-volume-label="${slider.dataset.volume}"]`).textContent = slider.value + '%';
            });

            document.getElementById('stopAll').addEventListener('click', () => engine.stopAll());

            // Sleep timer
            let sleepTimer = null;
            let sleepEndsAt = 0;
            sleepSelect.addEventListener('change', () => {
                clearTimeout(sleepTimer);
                const minutes = Number(sleepSelect.value);
                sleepEndsAt = minutes ? Date.now() + minutes * 60000 : 0;
                if (minutes) {
                    sleepTimer = setTimeout(() => {
                        engine.stopAll();
                        sleepSelect.value = '0';
                        sleepEndsAt = 0;
                        render();
                    }, minutes * 60000);
                }
                render();
            });

            function render() {
                const playing = engine.playingIds();
                engine.SOUNDS.forEach(s => {
                    const on = playing.includes(s.id);
                    const card = document.getElementById(`card-${s.id}`);
                    card.classList.toggle('playing', on);
                    const btn = card.querySelector('[data-play]');
                    btn.innerHTML = on ? pauseIcon : playIcon;
                    btn.setAttribute('aria-label', `${on ? 'Pause' : 'Play'} ${s.title}`);
                });
                if (playing.length) {
                    const names = playing.map(id => engine.SOUNDS.find(s => s.id === id).title).join(' + ');
                    const timerText = sleepEndsAt ? ` · stops at ${new Date(sleepEndsAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}` : '';
                    status.innerHTML = `Playing <strong>${names}</strong>${timerText}`;
                } else {
                    status.textContent = 'Tap play on any sound. You can mix several.';
                }
            }

            engine.onChange(render);
            render();
        })();
    </script>
  <script src="nav.js" defer></script>
  <script src="supabase-config.js" defer></script>
  <script src="sync.js" defer></script>
</body>

</html>
